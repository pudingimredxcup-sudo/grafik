name: ikonlar
on:
  push:
    paths: ['.github/workflows/ikon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ikon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ikon dosyalarini olustur
        run: |
          echo '' | base64 -d > icon-192.png
          echo '' | base64 -d > icon-512.png
          ls -l icon-192.png icon-512.png
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add icon-192.png icon-512.png
          git commit -m "Uygulama ikonlari (PNG)" || echo "degisiklik yok"
          git push
