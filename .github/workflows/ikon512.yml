name: ikon512
on:
  push:
    paths: ['.github/workflows/ikon512.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ikon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 512 ikonunu duzelt
        run: |
          echo '' | base64 -d | gunzip > icon-512.png
          ls -l icon-512.png
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add icon-512.png
          git commit -m "512 ikon duzeltildi" || echo "degisiklik yok"
          git push
