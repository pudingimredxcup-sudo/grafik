name: bt-data
on:
  push:
    branches: [backtest-data]
    paths: ['.github/workflows/bt-data.yml', '.github/bt/**']
permissions:
  contents: write
concurrency:
  group: bt-data
  cancel-in-progress: true
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: veri indir
        timeout-minutes: 60
        continue-on-error: true
        run: python3 -u .github/bt/get.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "backtest verisi (son 6 ay)" || echo "degisiklik yok"
          git push
